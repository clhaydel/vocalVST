name: Build Windows VST3

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the zip to a GitHub Release on tag pushes

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout (with JUCE submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure (MSVC, x64)
        # default generator = newest Visual Studio installed on the runner
        run: |
          cmake --version
          cmake -S . -B build -A x64 -DHV_BUILD_TOOLS=OFF -DHV_BUILD_TESTS=ON

      - name: Build VST3
        run: cmake --build build --config Release --target HarshVox_VST3 --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build/HarshVox_artefacts/Release/VST3/Harsh Vox.vst3" -DestinationPath "dist/HarshVox-windows-x64-vst3.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HarshVox-windows-x64-vst3
          path: dist/HarshVox-windows-x64-vst3.zip

      - name: Build and run unit tests
        run: |
          cmake --build build --config Release --target hv_tests --parallel
          build/hv_tests_artefacts/Release/hv_tests.exe

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HarshVox-windows-x64-vst3.zip
