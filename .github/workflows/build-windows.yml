name: Build Windows VST3

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the zip to a GitHub Release on tag pushes

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout (with JUCE submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Read version (CMakeLists.txt is the single source of truth)
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path CMakeLists.txt -Pattern 'project\(HarshVox VERSION ([0-9]+\.[0-9]+\.[0-9]+)'
          $v = $m.Matches[0].Groups[1].Value
          if (-not $v) { throw "could not read the version from CMakeLists.txt" }
          "version=$v" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref }}".StartsWith("refs/tags/v") -and "${{ github.ref_name }}" -ne "v$v") {
            throw "tag ${{ github.ref_name }} does not match the CMake version v$v"
          }
          Write-Host "Harsh Vox $v"

      - name: Configure (MSVC, x64)
        # default generator = newest Visual Studio installed on the runner
        run: |
          cmake --version
          cmake -S . -B build -A x64 -DHV_BUILD_TOOLS=OFF -DHV_BUILD_TESTS=ON

      - name: Build VST3
        run: cmake --build build --config Release --target HarshVox_VST3 --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build/HarshVox_artefacts/Release/VST3/Harsh Vox.vst3" -DestinationPath "dist/HarshVox-${{ steps.ver.outputs.version }}-windows-x64-vst3.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HarshVox-${{ steps.ver.outputs.version }}-windows-x64-vst3
          path: dist/HarshVox-${{ steps.ver.outputs.version }}-windows-x64-vst3.zip

      - name: Build and run unit tests
        run: |
          cmake --build build --config Release --target hv_tests --parallel
          build/hv_tests_artefacts/Release/hv_tests.exe

      - name: Release notes from CHANGELOG.md (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($v))\]").LineNumber
          if (-not $start) { throw "CHANGELOG.md has no section for $v" }
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
          $body = if ($end) { $rest[0..($end - 2)] } else { $rest }
          $body | Set-Content dist/release-notes.md

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Harsh Vox ${{ steps.ver.outputs.version }}
          body_path: dist/release-notes.md
          files: dist/HarshVox-${{ steps.ver.outputs.version }}-windows-x64-vst3.zip
